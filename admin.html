<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f6f2"><title>Администрирование · KAZAI</title><link rel="stylesheet" href="src/styles.css?v=4"><link rel="stylesheet" href="src/admin.css?v=4"></head><body class="admin-body"><header class="topbar admin-top"><a class="brand" href="/"><span class="brand-mark">K</span><span>KAZAI<span class="brand-dot">.</span></span></a><span class="admin-heading">Управление платформой</span><a class="text-link" href="/">На сайт ↗</a></header><main class="admin-main wrap"><section id="loginPanel" class="login-panel"><span class="eyebrow">ЗАЩИЩЁННЫЙ РАЗДЕЛ</span><h1>Вход<br>для <em>команды.</em></h1><p>Администраторский доступ создаётся из командной строки. Публичной регистрации администраторов нет.</p><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-dark">Войти <span>→</span></button><p id="loginError" class="form-message"></p></form></section><section id="dashboard" hidden><div class="dash-head"><div><span class="eyebrow">ПАНЕЛЬ МОДЕРАЦИИ</span><h1>Каталог под<br><em>контролем.</em></h1></div><div><span id="adminEmail"></span><button id="logout" class="button button-dark button-small">Выйти</button></div></div><nav class="dash-tabs"><button class="active" data-tab="submissions">Заявки</button><button data-tab="startups">Стартапы</button><button data-tab="events">Хакатоны</button></nav><section class="dash-panel" id="panel-submissions"><div class="panel-heading"><h2>Заявки на проверку</h2><span id="pendingCount" class="count-pill">0</span></div><div id="submissionsList" class="admin-list"></div></section><section class="dash-panel" id="panel-startups" hidden><div class="panel-heading"><h2>Проекты каталога</h2><button class="button button-dark button-small" id="newStartup">+ Добавить проект</button></div><div id="startupsList" class="admin-list"></div></section><section class="dash-panel" id="panel-events" hidden><div class="panel-heading"><h2>Хакатоны</h2><button class="button button-dark button-small" id="newEvent">+ Добавить событие</button></div><div id="eventsList" class="admin-list"></div></section></section></main><dialog id="editor"><form id="editorForm" method="dialog"><div class="dialog-head"><h2 id="editorTitle">Редактирование</h2><button type="button" id="closeEditor" aria-label="Закрыть">×</button></div><div id="editorFields" class="editor-fields"></div><p id="editorError" class="form-message"></p><div class="dialog-actions"><button type="button" class="button button-quiet" id="cancelEditor">Отмена</button><button class="button button-dark">Сохранить</button></div></form></dialog><div class="toast" id="toast"></div><script src="src/admin.js?v=4" defer></script></body></html>
